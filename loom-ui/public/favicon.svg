<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="loomThread" x1="4" y1="26" x2="28" y2="6" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5b4abf"/>
      <stop offset="1" stop-color="#8b7ae8"/>
    </linearGradient>
  </defs>

  <!-- Ozadje — temno, ujema se z Loom UI dark theme (bg: #0f0f13) -->
  <rect width="32" height="32" rx="7" fill="#15151a"/>

  <!-- Nit ki se pretka skozi tri točke — sanje/vzorci povezani skozi čas -->
  <path
    d="M 6 24 C 10 24, 10 10, 14 10 S 18 22, 22 22 S 24 8, 26 8"
    fill="none"
    stroke="url(#loomThread)"
    stroke-width="2.6"
    stroke-linecap="round"
  />

  <!-- Vozlišča — točke ki jih nit povezuje -->
  <circle cx="6" cy="24" r="2.3" fill="#8b7ae8"/>
  <circle cx="14" cy="10" r="2.3" fill="#a99af0"/>
  <circle cx="26" cy="8" r="2.3" fill="#5b4abf"/>
</svg>
